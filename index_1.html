.lift{transition:transform .25s,box-shadow .25s}
.lift:hover,.lift:focus-within{transform:translateY(-6px);box-shadow:0 16px 32px rgba(0,0,0,.22)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 28px;border-radius:8px;font-weight:500;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn i{font-style:normal;display:inline-block;transition:transform .2s}
.btn:hover i{transform:translateX(-6px)}
[dir=ltr] .btn:hover i{transform:translateX(6px)}
.ctl{min-height:44px;padding:0 18px;border:1.5px solid var(--h);border-radius:8px;background:var(--card);color:var(--h);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.ctl:hover{background:var(--solid);color:#fff}
.ob{transition:box-shadow .2s}.ob:hover{box-shadow:inset -5px 0 0 #C9A227}
[dir=ltr] .ob:hover{box-shadow:inset 5px 0 0 #C9A227}
.lab .more{max-height:0;opacity:0;overflow:hidden;transition:max-height .35s,opacity .35s}
.lab:hover .more,.lab:focus-within .more{max-height:220px;opacity:1}
.stat{transition:transform .2s}.stat:hover{transform:scale(1.08)}
.pj .ph{transition:transform .4s}.pj:hover .ph{transform:scale(1.08)}
.pj .ov{opacity:0;transition:opacity .25s}.pj:hover .ov{opacity:1}
.nw:hover h3{color:var(--hov)}
.h2{margin:0 0 4px;font-family:'Cairo',sans-serif;font-weight:800;font-size:30px;color:var(--h)}
.bar{display:block;width:48px;height:4px;margin-bottom:24px;background:#C9A227}
.sec{max-width:1200px;width:100%;box-sizing:border-box;margin:0 auto;padding:72px 32px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.rv{animation:up .7s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.cont{animation:spin 90s linear infinite;transform-origin:50% 50%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:9;background:#fff;color:#102E5E;padding:8px 14px;border-radius:6px}
.in{width:100%;box-sizing:border-box;min-height:48px;padding:0 16px;border:1.5px solid var(--mut);border-radius:8px;background:var(--card);color:var(--fg);font-family:inherit;font-size:17px}
.tag{display:inline-block;padding:6px 14px;margin:4px;border-radius:999px;background:var(--bg2);border:1px solid var(--bd);color:var(--h);font-size:14px;font-weight:500}
.lk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;color:inherit}
.ph1{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
</style>
</head>

function labs(){var P=D.P;return banner(D.T.labsH,P('ثلاثة مختبرات رئيسية تدعم الجانب التطبيقي للدراسة.','Three main labs supporting the practical side of study.'))+sec(P('مختبرات القسم','Department labs'),'<div style="display:grid;gap:20px">'+D.LABS.map(function(b,i){return '<article class="card lift" style="padding:28px;border-top:4px solid #C9A227"><span style="font-family:Cairo,sans-serif;font-weight:800;font-size:14px;color:var(--mut)">0'+(i+1)+'</span><h3 style="margin:2px 0 6px;font-family:Cairo,sans-serif;font-size:22px;color:var(--h)">'+b.t+'</h3><p style="margin:0 0 12px;color:var(--mut)">'+b.d+'</p><div>'+b.m.split(' · ').map(function(x){return '<span class="tag">'+x+'</span>'}).join('')+'</div></article>'}).join('')+'</div><p style="margin-top:20px;color:var(--mut)">'+P('يضم القسم 8 مختبرات علمية في المجمل.','The department has 8 scientific labs in total.')+'</p>','padding-bottom:72px')}
function projects(){var P=D.P;return banner(P('مشاريع التخرج والبحوث','Graduation projects and research'),P('النتاجات العلمية للقسم.','The department scientific output.'))+sec(P('النتاجات العلمية','Scientific output'),'<div class="ph1">'+ext(LK.res,P('البحوث العلمية','Research publications'),P('جدول بحوث التدريسيين','Faculty research sheet'))+ext(LK.prj,P('مشاريع الطلبة','Student projects'),P('قائمة مشاريع التخرج (ملف Word)','Graduation project list (Word file)'))+ext(LK.repo,P('المستودع الرقمي','Digital repository'),P('أبحاث تدريسيي القسم في مستودع جامعة بغداد','Department faculty papers in the University of Baghdad repository'))+'</div>','padding-bottom:72px')}
function news(){var P=D.P;return banner(D.T.newsH,P('أحدث أخبار كلية الهندسة، والمصدر موقع الكلية.','Latest College of Engineering news, sourced from the college website.'))+sec(P('آخر الأخبار','Latest news'),newsCards(3),'padding-bottom:72px')}
function contact(){var P=D.P;return banner(P('تواصل معنا','Contact us'),P('قنوات التواصل الرسمية للكلية.','Official college channels.'))+sec(P('قنوات التواصل','Channels'),'<div class="ph1">'+ext(LK.cont,P('صفحة الاتصال بالكلية','College contact page'),P('العنوان وأرقام الاتصال','Address and phone numbers'))+ext(LK.coll,P('صفحة القسم في موقع الكلية','Department page on the college site'),P('الموقع الرسمي','Official site'))+ext(LK.fb,'Facebook',P('صفحة كلية الهندسة','College of Engineering page'))+ext(LK.li,'LinkedIn',P('صفحة الكلية','College page'))+ext(LK.yt,'YouTube',P('قناة الكلية','College channel'))+ext(LK.uob,P('جامعة بغداد','University of Baghdad'),P('الموقع الرسمي للجامعة','University official site'))+'</div>','padding-bottom:72px')}
function footer(){var P=D.P,T=D.T;return '<footer style="background:var(--foot);color:#D5DEEA"><div style="max-width:1200px;margin:0 auto;padding:48px 32px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px"><div><div style="font-family:Cairo,sans-serif;font-weight:800;font-size:20px;color:#fff">'+T.brand+'</div><div style="font-size:14px">'+T.sub+'</div></div><div style="display:flex;flex-direction:column;font-size:15px">'+NAV().slice(1,5).map(function(n){return '<a href="#/'+n[0]+'" style="padding:6px 0;color:#fff">'+n[1]+'</a>'}).join('')+'</div><div style="display:flex;flex-direction:column;font-size:15px"><a href="'+LK.fb+'" target="_blank" rel="noopener" style="padding:6px 0;color:#fff">Facebook</a><a href="'+LK.li+'" target="_blank" rel="noopener" style="padding:6px 0;color:#fff">LinkedIn</a><a href="'+LK.yt+'" target="_blank" rel="noopener" style="padding:6px 0;color:#fff">YouTube</a></div></div><div style="max-width:1200px;margin:0 auto;padding:16px 32px 28px;border-top:1px solid rgba(255,255,255,.18);font-size:13px">© 2026 '+T.brand+' · '+T.uni+'</div></footer>'}
var PG={home:home,about:about,faculty:faculty,studies:studies,labs:labs,projects:projects,news:news,contact:contact};
function mv(){var ch=$('#ch');if(!ch)return;ch.style.left=(S.mx-14)+'px';ch.style.top=(S.my-14)+'px';$('#sp').style.background='radial-gradient(circle 280px at '+S.mx+'px '+S.my+'px,rgba(201,162,39,.22),transparent 70%)';$('#ro').innerHTML='E '+fmt(407000+S.mx*2.5)+'<br>N '+fmt(3686000-S.my*2.5)}
function render(keep){var y=window.scrollY;D=DATA(S.ar,S.dark);var r=document.documentElement;r.lang=S.ar?'ar':'en';r.dir=S.ar?'rtl':'ltr';r.dataset.theme=S.dark?'dark':'light';var nm=NAV().filter(function(n){return n[0]===S.page})[0];document.title=D.T.brand+' – '+(nm?nm[1]:'');app.innerHTML=header()+'<main id="main">'+(PG[S.page]||home)()+'</main>'+footer();if(S.page==='home')mv();window.scrollTo(0,keep?y:0)}
function route(){var h=(location.hash||'').replace('#/','');S.page=PAGES.indexOf(h)>-1?h:'home';render(false)}
app.addEventListener('click',function(e){var a=e.target.closest('[data-act]');if(!a)return;var k=a.getAttribute('data-act');if(k==='theme'){S.dark=!S.dark;save()}else if(k==='lang'){S.ar=!S.ar;save()}else if(k==='sel'){S.sel=+a.getAttribute('data-i')}else if(k==='deg'){S.deg=a.getAttribute('data-d')}render(true)});
app.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;$('#fl').innerHTML=facCards()}else if(e.target.id==='gr'){S.grade=e.target.value;$('#vd').textContent=verdict()}});
app.addEventListener('mousemove',function(e){var h=e.target.closest('#hero');if(!h)return;var r=h.getBoundingClientRect();S.mx=Math.round(e.clientX-r.left);S.my=Math.round(e.clientY-r.top);mv()});
window.addEventListener('hashchange',route);
load();route();
})();
</script>
</body>
